# =====================================================================
# PostgreSQL profile. Activate with: --spring.profiles.active=postgres
# Override credentials via environment variables (see README).
# =====================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/startupsim}
    username: ${DB_USERNAME:startupsim}
    password: ${DB_PASSWORD:startupsim}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
